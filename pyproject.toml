[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sniff"
version = "0.8.0"
description = "Open-source reprocessor for IONICON IoniTOF PTR-MS / PTR-TOF .h5 files — a PTR-MS Viewer replacement."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["h5py>=3.0", "numpy>=1.20"]

[project.optional-dependencies]
# Only ever imported inside a function, so the core package stays numpy + h5py + stdlib.
desktop = ["pywebview>=6"]

[project.scripts]
sniff = "sniff.analyze:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sniff = [
    "reference/*.json",
    "reference/*.csv",
    "reference/*.md",
    "reference/*.sqlite3",
]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "ruff>=0.16.4",
]
